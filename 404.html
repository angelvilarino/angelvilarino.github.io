<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Ángel Vilariño García</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f4fd8'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3EAV%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f6fa;--text:#0d2234;--muted:#50667b;--accent:#3b4fd8;--ink:#fff;--c1:#d98a00;--c2:#0e9f94;--c3:#e0415c;--c4:#3b4fd8;--c5:#5a9e1a}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1b29;--text:#e8f0f7;--muted:#93a9bc;--accent:#8d9bff;--ink:#0b1b29;--c1:#ffb84d;--c2:#4fd1c5;--c3:#ff7a90;--c4:#8d9bff;--c5:#9be564}}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;display:grid;place-items:center;text-align:center;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  main{position:relative;padding:24px;max-width:640px;pointer-events:none}
  main *{pointer-events:auto}
  h1{font:800 clamp(5rem,22vw,11rem)/.85 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em;margin:0 0 18px;color:var(--accent)}
  h2{font:800 clamp(1.4rem,4vw,2rem)/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
  p{color:var(--muted);margin:0 auto 26px;max-width:46ch}
  a{display:inline-block;background:var(--accent);color:var(--ink);font-weight:700;text-decoration:none;padding:12px 26px;border-radius:999px;transition:transform .2s}
  a:hover{transform:translateY(-2px) scale(1.03)}
  small{display:block;margin-top:22px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1>404</h1>
  <h2 id="t"></h2>
  <p id="d"></p>
  <a href="/" id="b"></a>
  <small id="s"></small>
</main>
<script>
  var es=(navigator.language||'es').toLowerCase().indexOf('es')===0;
  document.documentElement.lang=es?'es':'en';
  document.getElementById('t').textContent=es?'Esta página es un outlier':'This page is an outlier';
  document.getElementById('d').textContent=es?'Los datos no encuentran lo que buscas: probablemente la dirección está mal escrita o la página ya no existe.':"The data can't find what you're looking for: the address is probably mistyped or the page no longer exists.";
  document.getElementById('b').textContent=es?'Volver al inicio':'Back to home';
  document.getElementById('s').textContent=es?'Consejo: mueve el cursor y haz clic para dispersar los clústeres.':'Tip: move your cursor and click to scatter the clusters.';
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W,H;
  var css=getComputedStyle(document.documentElement),cols=[1,2,3,4,5].map(function(i){return css.getPropertyValue('--c'+i).trim()});
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
  var pts=[];for(var i=0;i<170;i++)pts.push({k:i%5,a:Math.random()*6.28,r:Math.pow(Math.random(),.7)*90+8,s:Math.random()*1.6+1.3,d:Math.random()<.5?-1:1,x:null,y:null});
  var m={x:-999,y:-999},burst=-1e9;
  addEventListener('pointermove',function(e){m.x=e.clientX;m.y=e.clientY});
  addEventListener('pointerdown',function(e){m.x=e.clientX;m.y=e.clientY;burst=performance.now()});
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){
    ctx.clearRect(0,0,W,H);
    var cs=cols.map(function(_,k){var th=k/5*6.283;return{x:W*(.5+.38*Math.cos(th+t*.00007)),y:H*(.5+.34*Math.sin(th*1.3+t*.00009))}});
    var b=Math.max(0,1-(t-burst)/600),R=120+260*b,F=46+120*b;
    pts.forEach(function(p){var c=cs[p.k],tx=c.x+p.r*Math.cos(p.a+p.d*t*.0003),ty=c.y+p.r*Math.sin(p.a+p.d*t*.0003),dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);
      if(d<R&&d>0){var f=(1-d/R)*F;tx+=dx/d*f;ty+=dy/d*f}
      if(p.x===null){p.x=tx;p.y=ty}p.x+=(tx-p.x)*.07;p.y+=(ty-p.y)*.07});
    ctx.lineWidth=1;
    for(var k=0;k<5;k++){var g=pts.filter(function(p){return p.k===k});ctx.strokeStyle=cols[k];ctx.globalAlpha=.16;ctx.beginPath();
      for(var i=0;i<g.length;i++)for(var j=i+1;j<g.length;j++)if(Math.hypot(g[i].x-g[j].x,g[i].y-g[j].y)<52){ctx.moveTo(g[i].x,g[i].y);ctx.lineTo(g[j].x,g[j].y)}ctx.stroke()}
    ctx.globalAlpha=.8;pts.forEach(function(p){ctx.fillStyle=cols[p.k];ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.283);ctx.fill()});
    if(!reduce)requestAnimationFrame(frame)}
  frame(0);
</script>
</body>
</html>
